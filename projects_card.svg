            <div class="proj-title">🌐 updated_portfolio</div>
            <div class="proj-desc">Multi-page portfolio and admin dashboard built with web technologies.</div>
            <div class="proj-link">➔ odhiambo-maxwel.vercel.app</div>
          </div>
          <div class="card">
            <div class="proj-title">🔐 glassmorphism_login</div>
