          margin-bottom: 8px;
        }
        .proj-link {
          color: #00e5ff;
          font-size: 11px;
          text-decoration: none;
        }
      </style>
      <div class="container">
        <div class="header">
          <span class="title">🚀 Featured Projects</span>
          <span class="badge">Live &amp; Deployed</span>
        </div>
        <div class="grid">
