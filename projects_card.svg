<svg fill="none" viewBox="0 0 920 320" width="920" height="320" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: "Courier New", Consolas, monospace;
          background-color: #0b0f19;
          color: #ffffff;
          padding: 24px;
          border-radius: 16px;
          height: 320px;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 -3px 0 #00e5ff;
        }
        .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 15px;
