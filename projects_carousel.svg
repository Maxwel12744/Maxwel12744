<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="160">
  <style>
    .bg { fill: #0d1117; rx: 10px; }
    .border { stroke: #30363d; stroke-width: 2; fill: none; rx: 10px; }
    .title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: bold; }
    .desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
    .link { fill: #388bfd; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
    .badge { fill: #21262d; rx: 6px; }
    .badge-text { fill: #c9d1d9; font-family: sans-serif; font-size: 11px; }

    /* Animation container for slides */
    .slide {
      opacity: 0;
      animation: fadeAnimation 16s infinite;
    }

    /* Timing for 4 slides (each visible for 4 seconds out of 16s total) */
    .slide-1 { animation-delay: 0s; }
    .slide-2 { animation-delay: 4s; }
    .slide-3 { animation-delay: 8s; }
    .slide-4 { animation-delay: 12s; }

    @keyframes fadeAnimation {
      0% { opacity: 0; }
      5% { opacity: 1; }
      25% { opacity: 1; }
      30% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>

  <!-- Card Background & Border -->
  <rect width="600" height="160" class="bg" />
  <rect width="600" height="160" class="border" />

  <!-- SLIDE 1: Updated Portfolio -->
  <g class="slide slide-1">
    <rect x="25" y="20" width="80" height="24" class="badge" />
    <text x="35" y="36" class="badge-text">🌐 Web App</text>
    <text x="120" y="38" class="title">updated_portfolio</text>
    <text x="25" y="75" class="desc">Multi-page portfolio and an admin dashboard.</text>
    <text x="25" y="105" class="link">Repo: github.com/Maxwell12744/updated_portfolio</text>
    <text x="25" y="125" class="link">Live: odhiambo-maxwel.vercel.app</text>
  </g>

  <!-- SLIDE 2: Glassmorphism Login -->
  <g class="slide slide-2">
    <rect x="25" y="20" width="90" height="24" class="badge" />
    <text x="35" y="36" class="badge-text">🔒 Security</text>
    <text x="130" y="38" class="title">glassmorphism_login</text>
    <text x="25" y="75" class="desc">User registration, login, and frosted-glass design.</text>
    <text x="25" y="105" class="link">Repo: github.com/Maxwell12744/glassmorphism_login</text>
  </g>

  <!-- SLIDE 3: Cautious Fishstick -->
  <g class="slide slide-3">
    <rect x="25" y="20" width="95" height="24" class="badge" />
    <text x="35" y="36" class="badge-text">🎮 Experiment</text>
    <text x="135" y="38" class="title">cautious_fishstick</text>
    <text x="25" y="75" class="desc">Adds students' marks and displays results.</text>
    <text x="25" y="105" class="link">Repo: github.com/Maxwell12744/cautious_fishstick</text>
  </g>

  <!-- SLIDE 4: Xtreme Parking System -->
  <g class="slide slide-4">
    <rect x="25" y="20" width="85" height="24" class="badge" />
    <text x="35" y="36" class="badge-text">🛒 System</text>
    <text x="125" y="38" class="title">xtreme-parking-system-application</text>
    <text x="25" y="75" class="desc">A smart parking system application.</text>
    <text x="25" y="105" class="link">Repo: github.com/Maxwell12744/xtreme-parking-system-application</text>
  </g>
</svg>